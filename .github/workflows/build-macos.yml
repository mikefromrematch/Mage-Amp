name: Build MAGE macOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    # Use a standard hosted macOS runner label (avoid custom ARM runner configuration).
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package app
        run: |
          mkdir -p dist
          APP="$(find build -name 'MAGE.app' -type d -print -quit)"
          if [ -z "$APP" ]; then
            echo "Could not find MAGE.app in build output"
            find build -maxdepth 6 -print
            exit 1
          fi
          ditto "$APP" dist/MAGE.app
          cd dist
          zip -r MAGE-macOS.zip MAGE.app

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAGE-macOS
          path: dist/MAGE-macOS.zip
          retention-days: 30
